[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgdb"
version = "1.0.0"
description = "短剧数据展示站：把 JSONL + 封面变成一个可浏览、可筛选、可标注、可播放的本地站点"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hgdb contributors" }]
keywords = ["sqlite", "http", "jsonl", "self-hosted", "no-dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# 零第三方依赖：只用标准库（http.server + sqlite3）。
# 这是设计取向，不是还没补完 —— 加依赖前请先想清楚。
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # 钉版本：ruff 的新版本会不断加规则，跨版本跑 lint 会得到不同结论
    "ruff==0.6.9",
]

[project.scripts]
hgdb = "hgdbctl:main"
hgdb-serve = "hgdb.server:main"
hgdb-manage = "manage:main"

[project.urls]
Homepage = "https://github.com/kingatnextdoor/hgdb"
Documentation = "https://github.com/kingatnextdoor/hgdb#docs"

[tool.setuptools]
# 只打包 Python 包和根目录脚本，不带 output/、sample/、tests/。
packages = ["hgdb"]
py-modules = ["manage", "hgdbctl", "compact_exports"]

[tool.setuptools.package-data]
# 前端资源：没有这些，pip 装完之后页面是白屏。
hgdb = ["static/*", "static/css/*", "static/js/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # 行宽交给 formatter，不因为注释超长报错
    "B008",
    # 下面三条是刻意保留的写法，不是为了兼容老版本：
    "UP031",  # % 格式化：日志与 SQL 拼接里比 f-string 更好读，也别扭地更安全
    "UP009",  # 每个文件都写 coding 声明：Windows 上拿记事本打开不会乱码
    "UP038",  # isinstance 不合并成 X | Y：3.10 才支持，且对 tuple 形式更清楚
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试是标准库 unittest 风格，pytest 能直接跑
python_files = ["test_*.py"]
