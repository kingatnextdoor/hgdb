name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 本项目零第三方依赖，测试只用标准库，所以只装 dev 里那两样
      - name: Install dev tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest tests/ -q

  smoke:
    # 真起一次服务，确认 sample 数据能读、接口能出、契约版本对得上
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Boot with sample data
        run: |
          python webctl.py start --output sample -f --port 8899 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8899/api/stats -o /tmp/stats.json; then break; fi
            sleep 1
          done
          cat /tmp/stats.json
          python -c "import json;d=json.load(open('/tmp/stats.json'));s=d['stats'];assert s['total']>0,'sample 数据没被读到';assert s['schema_version']<=s['schema_supported'],'契约版本异常';print('ok total =',s['total'])"
          curl -fsS "http://127.0.0.1:8899/api/dramas?size=1" -o /dev/null
          curl -fsS http://127.0.0.1:8899/ -o /dev/null
          echo "首页与列表接口正常"

      - name: Boot with empty output
        # 没有数据也必须能启动，页面显示 0 部而不是 500
        run: |
          python webctl.py stop || true
          mkdir -p /tmp/empty
          python webctl.py start --output /tmp/empty -f --port 8898 > /tmp/serve2.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8898/api/stats -o /tmp/stats2.json; then break; fi
            sleep 1
          done
          cat /tmp/stats2.json
          python -c "import json;d=json.load(open('/tmp/stats2.json'));assert d['stats']['total']==0;print('ok 空目录可用')"

      - name: Show log on failure
        if: failure()
        run: cat /tmp/serve.log /tmp/serve2.log
